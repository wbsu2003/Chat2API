name: CI (Windows)

# Test-stage CI: Windows only, per project decision.
# Multi-platform builds happen in release.yml on tag push.
#
# Artifacts policy (storage quota is limited):
#   - Nothing is uploaded by default; the job only proves the build works.
#   - The electron-builder --dir output (~250MB unpacked) is NEVER uploaded.
#   - Run this workflow manually with `upload_installer: true` to get a single
#     NSIS .exe (~90MB) with a short retention window.
#   - Release assets do NOT count against the Actions artifact quota, so
#     release.yml publishes directly to a GitHub Release instead.

on:
  # Only `branches` is declared: GitHub skips a push workflow entirely for
  # branch pushes when the push filter defines just tags/tags-ignore. Declaring
  # branches also means tag pushes do not trigger this workflow, which is what
  # we want - tags are release.yml's job.
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      upload_installer:
        description: 'Build and upload the NSIS installer (consumes artifact storage)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` hard-fails when package.json and package-lock.json disagree.
      # This environment has no local Node toolchain, so dependency edits cannot
      # be locked locally; fall back to a resolving install instead of failing
      # the whole run. Run sync-lockfile.yml to make `npm ci` work again.
      - name: Install dependencies
        shell: bash
        run: npm ci || (echo "::warning::package-lock.json is out of sync, falling back to npm install" && npm install --no-audit --no-fund)
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # Guards the one-line anchors that wire src/main/plugins into upstream
      # files. An upstream merge can silently drop them without breaking the
      # build, which would disable every plugin provider at runtime.
      - name: Verify plugin anchors
        run: node scripts/verify-anchors.js

      # Node's default test matcher is **/*.test.?(c|m)js, so the repository's
      # .ts test files are skipped. They have no runner configured (no tsx or
      # vitest) and have never run in CI; enabling them is tracked separately.
      # Node's default matcher is **/*.test.?(c|m)js, so the repository's .ts
      # tests are skipped - they have no runner configured and have never run.
      #
      # continue-on-error: these tests had never executed before this workflow
      # existed, so pre-existing failures are expected. Build results are more
      # informative right now; the final step still fails the run.
      - name: Run tests
        id: tests
        continue-on-error: true
        run: node --test tests/

      - name: Run plugin unit tests
        id: plugin_tests
        continue-on-error: true
        run: npm run test:plugins

      - name: Build application
        run: npm run build
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # Proves the electron-builder config (asarUnpack, extraResources,
      # fileAssociations) is still valid without producing an installer.
      - name: Verify packaging
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.upload_installer) }}
        run: npx electron-builder --win --x64 --dir
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_installer }}
        run: npx electron-builder --win --x64
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Upload installer
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: chat2api-win-x64-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      # Surfaces test outcomes after the build has run, so one CI round reports
      # both "do the tests pass" and "does it still compile".
      - name: Report test results
        if: always()
        shell: bash
        run: |
          echo "tests:        ${{ steps.tests.outcome }}"
          echo "plugin tests: ${{ steps.plugin_tests.outcome }}"
          if [ "${{ steps.tests.outcome }}" != "success" ] || [ "${{ steps.plugin_tests.outcome }}" != "success" ]; then
            echo "::error::Test suite failed - see the 'Run tests' step above"
            exit 1
          fi
