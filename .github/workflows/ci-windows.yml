name: CI (Windows)

# Test-stage CI: Windows only, per project decision.
# Multi-platform builds happen in release.yml on tag push.
#
# Artifacts policy (storage quota is limited):
#   - Nothing is uploaded by default; the job only proves the build works.
#   - The electron-builder --dir output (~250MB unpacked) is NEVER uploaded.
#   - Run this workflow manually with `upload_installer: true` to get a single
#     NSIS .exe (~90MB) with a short retention window.
#   - Release assets do NOT count against the Actions artifact quota, so
#     release.yml publishes directly to a GitHub Release instead.

on:
  # Only `branches` is declared: GitHub skips a push workflow entirely for
  # branch pushes when the push filter defines just tags/tags-ignore. Declaring
  # branches also means tag pushes do not trigger this workflow, which is what
  # we want - tags are release.yml's job.
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      upload_installer:
        description: 'Build and upload the NSIS installer (consumes artifact storage)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    env:
      # Build and upload an installer when either:
      #   - manually dispatched with upload_installer checked, or
      #   - the pushed commit message contains [installer]
      #
      # The commit-message route exists because workflow_dispatch is only
      # offered for workflows present on the default branch, so it is
      # unavailable while this work lives on a feature branch.
      WANT_INSTALLER: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload_installer) || contains(github.event.head_commit.message, '[installer]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # `npm ci` hard-fails when package.json and package-lock.json disagree.
      # This environment has no local Node toolchain, so dependency edits cannot
      # be locked locally; fall back to a resolving install instead of failing
      # the whole run. Run sync-lockfile.yml to make `npm ci` work again.
      - name: Install dependencies
        shell: bash
        run: npm ci || (echo "::warning::package-lock.json is out of sync, falling back to npm install" && npm install --no-audit --no-fund)
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # Guards the one-line anchors that wire src/main/plugins into upstream
      # files. An upstream merge can silently drop them without breaking the
      # build, which would disable every plugin provider at runtime.
      - name: Verify plugin anchors
        run: node scripts/verify-anchors.js

      # Node's default matcher is **/*.test.?(c|m)js, so the repository's .ts
      # tests are skipped - they have no runner configured (no tsx/vitest) and
      # have never run in CI.
      #
      # tests/skills/ is excluded: it covers AI-agent helper scripts and
      # SKILL.md frontmatter, unrelated to the application. Two of its tests
      # fail on a clean upstream checkout. See "Known failing tests" in
      # docs/PLUGINS.md.
      - name: Run tests
        shell: bash
        run: |
          set +e
          node --test $(ls -d tests/*/ | grep -v 'tests/skills/') 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo ""
            echo "===================== FAILING TESTS ====================="
            grep -E '^not ok ' test-output.txt || echo "(none)"
            echo ""
            echo "-------------------- FAILURE DETAIL ---------------------"
            # TAP emits a YAML block with assertion detail after each failure.
            awk '/^not ok /{show=25} show&&show-->0' test-output.txt || true
            echo "========================================================="
          fi
          exit $code

      - name: Run plugin unit tests
        run: npm run test:plugins

      - name: Build application
        run: npm run build
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # Proves the electron-builder config (asarUnpack, extraResources,
      # fileAssociations) is still valid without producing an installer.
      - name: Verify packaging
        if: env.WANT_INSTALLER != 'true'
        run: npx electron-builder --win --x64 --dir
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      # Only the portable target. package.json's win.target lists both nsis and
      # portable, and a bare `--win` builds both - NSIS needs an extra toolchain
      # download (nsis, winCodeSign) that fails in CI, taking the whole step
      # down with it. A portable single-file exe is also friendlier for ad-hoc
      # verification: download, run, delete. NSIS stays for real releases.
      - name: Build portable app
        if: env.WANT_INSTALLER == 'true'
        run: npx electron-builder --win portable --x64 --publish never
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Upload portable app
        if: env.WANT_INSTALLER == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: chat2api-win-x64-portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
